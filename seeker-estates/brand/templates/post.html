<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Seeker Estates — social post template</title>
<!-- One template, many formats. Rendered by render.js from a JSON spec (see README in BRAND.md).
     Formats: cover, cover-dark, inside, cta (1080x1350) · reel-title, story (1080x1920) · tag (location tag strip).
     Text markup: *word* = Fraunces italic in clay (accent), \n = line break. -->
<style>
@font-face { font-family: "Fraunces"; src: url("../fonts/fraunces-latin-wght-normal.woff2") format("woff2"); font-weight: 300 900; }
@font-face { font-family: "Fraunces"; src: url("../fonts/fraunces-latin-wght-italic.woff2") format("woff2"); font-weight: 300 900; font-style: italic; }
@font-face { font-family: "Jakarta"; src: url("../fonts/plus-jakarta-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Jakarta"; src: url("../fonts/plus-jakarta-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Jakarta"; src: url("../fonts/plus-jakarta-sans-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
:root { --green: #0F3D2E; --green-600: #1F5A44; --ivory: #F6F1E7; --sand: #EADFCB; --clay: #C8582F; --clay-700: #A9441F; --peach: #F0A483; --ink: #13221C; --muted: #4E5E56; }
* { box-sizing: border-box; margin: 0; }
html, body, #root { width: var(--w); height: var(--h); overflow: hidden; }
.post { position: relative; width: 100%; height: 100%; padding: 96px 96px 88px; display: flex; flex-direction: column; font-family: "Jakarta", sans-serif; }
.light { background: var(--ivory); color: var(--ink); }
.dark { background: var(--green); color: var(--ivory); }
.clay { background: var(--clay-700); color: var(--ivory); }
.top { display: flex; justify-content: space-between; align-items: flex-start; }
.logo { height: 84px; }
.label { font: 700 26px/1.2 "Jakarta"; letter-spacing: .18em; text-transform: uppercase; color: var(--clay-700); text-align: right; max-width: 560px; }
.dark .label, .clay .label { color: var(--peach); }
.clay .label { color: var(--sand); }
h1, h2 { font-family: "Fraunces", serif; font-weight: 560; letter-spacing: -.02em; }
h1 { font-size: 104px; line-height: 1.02; }
h2 { font-size: 70px; line-height: 1.06; margin-bottom: 36px; }
h1 em, h2 em { font-style: italic; font-weight: 480; color: var(--clay-700); }
.dark h1 em, .dark h2 em { color: var(--peach); }
.clay h1 em, .clay h2 em { color: var(--sand); }
.body { font-size: 36px; line-height: 1.45; color: var(--muted); max-width: 820px; }
.dark .body { color: #C9D8CF; }
.mid { margin-top: auto; margin-bottom: auto; }
.foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
.rule { width: 84px; height: 5px; border-radius: 3px; background: var(--clay); margin-bottom: 22px; }
.dark .rule, .clay .rule { background: var(--peach); }
.note { font-size: 26px; line-height: 1.35; color: var(--muted); max-width: 680px; }
.dark .note, .clay .note { color: #C9D8CF; }
.swipe { font: 700 28px/1 "Jakarta"; display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.page { font: 700 26px/1 "Jakarta"; letter-spacing: .12em; color: var(--clay-700); }
.dark .page { color: var(--peach); }
.arch { position: absolute; right: -120px; bottom: -160px; width: 560px; height: 700px; border-radius: 280px 280px 0 0; background: rgba(15,61,46,.05); z-index: 0; }
.dark .arch { background: rgba(255,255,255,.05); }
.post > *:not(.arch) { position: relative; z-index: 1; }
.pill { display: inline-block; padding: 26px 46px; border-radius: 999px; background: var(--ivory); color: var(--green); font: 700 44px/1 "Jakarta"; }
.cta-sub { font: 600 34px/1.4 "Jakarta"; color: #C9D8CF; margin-top: 30px; }
/* 9:16 formats keep text inside the safe zone: 288px top, 480px bottom */
.tall { padding: 288px 96px 480px; align-items: center; text-align: center; justify-content: center; }
.tall .mark { width: 220px; height: 220px; margin-bottom: 64px; }
.tall h1 { font-size: 128px; }
.tall .label { text-align: center; margin-bottom: 28px; max-width: none; }
.tall .body { margin-top: 36px; color: inherit; opacity: .85; max-width: 860px; }
.tag-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: transparent; }
.tag { display: inline-flex; align-items: center; gap: 18px; padding: 22px 34px; border-radius: 999px; background: var(--clay-700); color: var(--ivory); font: 700 30px/1 "Jakarta"; letter-spacing: .08em; white-space: nowrap; }
.tag svg { width: 30px; height: 30px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const MARK = (fill, key) => `<svg class="mark" viewBox="0 0 64 64"><path d="M12 62V30A20 20 0 0 1 52 30V62Z M32 22.5a7.5 7.5 0 0 0-3.6 14.08L26.5 50h11l-1.9-13.42A7.5 7.5 0 0 0 32 22.5Z" fill="${fill}" fill-rule="evenodd"/>${key ? `<path d="M32 22.5a7.5 7.5 0 0 0-3.6 14.08L26.5 50h11l-1.9-13.42A7.5 7.5 0 0 0 32 22.5Z" fill="${key}"/>` : ""}</svg>`;
const esc = (s) => String(s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const md = (s) => esc(s).replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/\n/g, "<br>");
const ARROW = '<svg width="44" height="16" viewBox="0 0 44 16"><path d="M0 8h40M33 1l8 7-8 7" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>';

function render(spec) {
  const f = spec.format || "cover";
  const tall = f === "reel-title" || f === "story";
  document.documentElement.style.setProperty("--w", (spec.width || 1080) + "px");
  document.documentElement.style.setProperty("--h", (spec.height || (tall ? 1920 : f === "tag" ? 140 : 1350)) + "px");
  const theme = spec.theme || ({ "cover-dark": "dark", cta: "dark", "reel-title": "dark" }[f] || "light");
  const logo = theme === "light" ? "../logo/svg/seeker-estates-logo-green.svg" : "../logo/svg/seeker-estates-logo-ivory.svg";
  const top = `<div class="top"><img class="logo" src="${logo}" alt="Seeker Estates"><div class="label">${md(spec.label)}</div></div>`;
  const foot = (right) => `<div class="foot"><div>${spec.footnote ? `<div class="rule"></div><p class="note">${md(spec.footnote)}</p>` : ""}</div>${right || ""}</div>`;
  let html = "";
  if (f === "cover" || f === "cover-dark") {
    html = `<div class="post ${theme}"><div class="arch"></div>${top}<div class="mid"><h1>${md(spec.headline)}</h1>${spec.body ? `<p class="body" style="margin-top:36px">${md(spec.body)}</p>` : ""}</div>${foot(`<span class="swipe">${esc(spec.swipe || "Swipe")} ${ARROW}</span>`)}</div>`;
  } else if (f === "inside") {
    html = `<div class="post ${theme}">${top}<div class="mid"><h2>${md(spec.headline)}</h2><p class="body">${md(spec.body)}</p></div>${foot(spec.page ? `<span class="page">${esc(spec.page)}</span>` : "")}</div>`;
  } else if (f === "cta") {
    html = `<div class="post ${theme}"><div class="arch"></div>${top}<div class="mid"><h1 style="font-size:92px">${md(spec.headline)}</h1>${spec.url !== "" ? `<div style="margin-top:56px"><span class="pill">${esc(spec.url || "seekerestates.com")}</span></div>` : ""}${spec.body ? `<p class="cta-sub">${md(spec.body)}</p>` : ""}</div>${foot()}</div>`;
  } else if (tall) {
    const mk = theme === "light" ? MARK("#0F3D2E", "#C8582F") : MARK("#F6F1E7", "#C8582F");
    html = `<div class="post tall ${theme}">${spec.mark === false ? "" : mk}${spec.label ? `<div class="label">${md(spec.label)}</div>` : ""}<h1>${md(spec.headline)}</h1>${spec.body ? `<p class="body">${md(spec.body)}</p>` : ""}</div>`;
  } else if (f === "tag") {
    html = `<div class="tag-wrap"><span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(spec.headline)}</span></div>`;
  }
  document.getElementById("root").innerHTML = html;
}
window.render = render;
try { if (location.hash.length > 1) render(JSON.parse(decodeURIComponent(location.hash.slice(1)))); } catch (e) {}
</script>
</body>
</html>
